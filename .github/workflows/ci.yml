name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Manifests, clean install, reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Manifest check (exact versions; src/package.json matches package.json)
        run: npm run check:manifests
      - name: Clean install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Reproducible build (second build must be byte-identical)
        run: |
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/build1.sha256
          rm -rf dist
          npm run build
          (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/build2.sha256
          diff /tmp/build1.sha256 /tmp/build2.sha256
          echo "Build is reproducible: $(wc -l < /tmp/build1.sha256) files, identical hashes"

  typecheck:
    name: Type-check ratchet (known backlog, no new errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:ratchet

  e2e:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  flag-flip:
    name: Real-sign-in build switched off behaves like the prototype (same 8 journeys, M2.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build with VITE_KUBICU_REAL_AUTH=true, switch it off in /config.js, run the unchanged journeys
        run: npm run test:e2e:flag-flip
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-flag-flip
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  flag-flip-windows:
    name: Real-sign-in build and the same 8 journeys on Windows (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Build the real-sign-in build, switch it off in /config.js, run the unchanged journeys
        shell: pwsh
        run: npm run test:e2e:flag-flip
      - name: The real-sign-in build loads /config.js; the normal build does not
        shell: pwsh
        run: |
          npm run build
          if (-not (Select-String -Quiet -SimpleMatch 'src="/config.js"' dist-realauth/index.html)) { throw 'dist-realauth/index.html does not load /config.js' }
          if (Select-String -Quiet -SimpleMatch 'config.js' dist/index.html) { throw 'dist/index.html must not load /config.js' }
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-flag-flip-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan all commits
        run: ./gitleaks git --redact --no-banner --verbose .
